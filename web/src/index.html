<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="view"></div>

  <div id="toolbar" class="toolbar"></div>

  <div id="status" class="status" hidden>
    <span class="spinner"></span><span id="status-text"></span>
  </div>

  <div id="empty" class="empty" hidden></div>

  <!-- Größe links, Meldungen rechts; ist es zu eng, stehen die Meldungen über der Größe -->
  <div class="bottom">
    <div id="info" class="info" hidden></div>

    <div id="messages" class="messages" hidden>
      <button id="messages-summary" class="messages-summary" type="button"></button>
      <ol id="messages-list" class="messages-list"></ol>
    </div>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
